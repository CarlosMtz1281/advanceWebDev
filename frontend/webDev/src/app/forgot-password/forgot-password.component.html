<div class="container">
    <div class="login-box">
      <h2 class="title">Get new password</h2>
  
      <form>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
  
        <button type="button" class="btn" (click)="sendReset()">Send</button>
        <button class="link-btn" (click)="backToSignIn()">Back To Sign In</button>
      
    </form>
  
         
          
    </div>
  </div>

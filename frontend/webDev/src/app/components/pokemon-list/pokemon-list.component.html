<div class="search-container">
  <input type="text" [(ngModel)]="searchQuery" (input)="applyFilters()" placeholder="Search Pokémon...">
</div>

<div class="pokemon-grid">
  <div class="pokemon-card" *ngFor="let pokemon of displayedPokemons">
    <img [src]="pokemon.image" [alt]="pokemon.name" class="pokemon-image">
    <h3>{{ pokemon.name | titlecase }}</h3>
    <p class="pokemon-types">
      <span *ngFor="let type of pokemon.types" class="pokemon-type {{ type }}">
        {{ type | titlecase }}
      </span>
    </p>
  </div>
</div>

<div class="pagination">
  <button (click)="prevPage()" [disabled]="currentPage === 1">Previous</button>

  <button *ngFor="let page of totalPagesArray" (click)="goToPage(page)" [class.active]="page === currentPage">
    {{ page }}
  </button>

  <button (click)="nextPage()" [disabled]="currentPage * pageSize >= filteredPokemons.length">Next</button>
</div>

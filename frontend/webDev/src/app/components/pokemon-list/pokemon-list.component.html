<div class="pokemon-grid">
    <div class="pokemon-card" *ngFor="let pokemon of pokemons">
      <img [src]="pokemon.image" [alt]="pokemon.name" class="pokemon-image">
      <h3>{{ pokemon.name | titlecase }}</h3>
      <p class="pokemon-types">
        <span *ngFor="let type of pokemon.types" class="pokemon-type {{ type }}">
          {{ type | titlecase }}
        </span>
      </p>
    </div>
  </div>
